name: Build Wave Buddy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          npm install
          mkdir -p www
          cp index.html www/index.html
          cp *.css www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          cp -r assets www/ 2>/dev/null || true
          cp -r icons www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true
          npx cap init "Wave Buddy" com.wavelord.wavebuddy --web-dir=www || true
          if [ ! -d android ]; then npx cap add android || true; fi
          npx cap sync android

          # --- FIX ICON - USE resources/icon.png ---
          if [ -f resources/icon.png ]; then
            ICON_SRC="resources/icon.png"
          elif [ -f icon.png ]; then
            ICON_SRC="icon.png"
          else
            echo "❌ ERROR: No icon found in resources/icon.png or icon.png"
            ls -la *.png resources/ || true
            exit 1
          fi
          echo "✅ Found icon: $ICON_SRC, size: $(stat -c%s $ICON_SRC) bytes"
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$d
            cp $ICON_SRC android/app/src/main/res/$d/ic_launcher.png
            cp $ICON_SRC android/app/src/main/res/$d/ic_launcher_round.png
            cp $ICON_SRC android/app/src/main/res/$d/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          ls -lh android/app/src/main/res/mipmap-xxxhdpi/

          # --- FIX OVERLAY - copy YOUR java files from overlay/ ---
          DEST=android/app/src/main/java/com/wavelord/wavebuddy
          mkdir -p $DEST
          if [ -d overlay ]; then
            echo "--- Files in overlay/ BEFORE copy ---"
            ls -l overlay/
            echo "--- Cleaning Capacitor-generated MainActivity (prevents duplicate class) ---"
            rm -f $DEST/*.java
            ls -l $DEST/ || echo "(DEST now empty, good)"
            cp overlay/*.java $DEST/
            echo "--- FIX PACKAGE - force all files to com.wavelord.wavebuddy ---"
            sed -i 's/^package .*/package com.wavelord.wavebuddy;/' $DEST/*.java
            grep -h "^package" $DEST/*.java
            echo "--- Overlay files copied ---"
            ls -l $DEST/
            echo "--- VALIDATION: each file must contain ONLY its own class ---"
            echo "MainActivity.java should contain 1x 'public class MainActivity' and 0x 'FloatingBuddy extends':"
            grep -c "public class MainActivity" $DEST/MainActivity.java || echo "❌ MainActivity.java missing MainActivity class"
            grep -c "public class FloatingBuddy" $DEST/MainActivity.java && echo "❌ ERROR: MainActivity.java contains FloatingBuddy class - duplicate!" && exit 1 || echo "✅ MainActivity.java clean"
            echo "FloatingBuddy.java should contain 1x 'public class FloatingBuddy' and 0x 'class MainActivity':"
            grep -c "public class FloatingBuddy" $DEST/FloatingBuddy.java || echo "❌ FloatingBuddy.java missing FloatingBuddy class"
            grep -c "class MainActivity" $DEST/FloatingBuddy.java && echo "❌ ERROR: FloatingBuddy.java contains MainActivity class - THIS IS THE DUPLICATE BUG!" && exit 1 || echo "✅ FloatingBuddy.java clean"
            echo "--- Full class list in DEST ---"
            grep -h "public class" $DEST/*.java
          else
            echo "❌ overlay/ folder not found!"
            exit 1
          fi

          # --- FIX MANIFEST - use YOUR root AndroidManifest.xml ---
          if [ -f AndroidManifest.xml ]; then
            cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            echo "Copied YOUR AndroidManifest.xml"
          fi
          if ! grep -q 'android:icon=' android/app/src/main/AndroidManifest.xml; then
            echo "⚠️ Manifest missing icon, patching it"
            sed -i 's|<application| <application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"|' android/app/src/main/AndroidManifest.xml
          fi
          echo "--- FINAL MANIFEST ---"
          cat android/app/src/main/AndroidManifest.xml

          # --- FIX INDEX.HTML - force YOUR index.html into assets AFTER sync ---
          mkdir -p android/app/src/main/assets/public
          cp index.html android/app/src/main/assets/public/index.html
          echo "--- Check assets index.html has miniChat ---"
          grep -c "miniChat" android/app/src/main/assets/public/index.html || echo "miniChat NOT FOUND in assets!"
          echo "--- Check assets index.html has FIXED sendMiniChat (await) ---"
          grep -c "__miniWaiting" android/app/src/main/assets/public/index.html || echo "⚠️ WARNING: index.html is OLD - no __miniWaiting fix! Thinking will still stick!"

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wave-buddy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build Wave Buddy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          npm install
          mkdir -p www
          cp *.html www/ 2>/dev/null || true
          cp *.css www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          cp *.json www/ 2>/dev/null || true
          cp -r assets www/ 2>/dev/null || true
          cp -r icons www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true
          npx cap init "Wave Buddy" com.wavelord.wavebuddy --web-dir=www || true
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wave-buddy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

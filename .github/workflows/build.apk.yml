name: Build Wave Buddy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor if needed
        run: |
          npx cap init "Wave Buddy" com.wavelord.wavebuddy --web-dir=. || true
          npx cap add android || true
          npx cap sync android

      - name: Copy Icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || echo "Add icon.png to repo root"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wave-buddy-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

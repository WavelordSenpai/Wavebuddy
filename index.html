<!DOCTYPE html>
<html lang="en">
<head>

<title>Wave Buddy V3.5 FINAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0A0A0A;font-family:Inter, Arial, sans-serif;overflow:hidden;height:100vh;height:100dvh}
#room{width:100%;height:100vh;height:100dvh;position:relative;background:radial-gradient(circle at 50% 30%, #1A1505 0%, #0A0A0A 70%);overflow:hidden}
body.overlay #room{background:transparent}
body.overlay #hint{display:none}
#buddyWrap{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:130px;height:160px;z-index:10;cursor:grab;touch-action:none;will-change:transform}
#spriteBox{width:130px;height:160px;position:relative;z-index:1;transition:transform .6s cubic-bezier(.25,1,.35,1);transform-origin:center center;filter:drop-shadow(0 12px 12px rgba(0,0,0,.45))}
#spriteBox svg{width:130px;height:160px;overflow:visible}
#spriteBox .body{transform-origin:50% 50%;transform-box:fill-box;transition:transform .6s cubic-bezier(.25,1,.35,1)}
#spriteBox .head{transform-origin:50% 85%;transform-box:fill-box;transition:transform .6s cubic-bezier(.25,1,.35,1)}
#spriteBox .eye{transform-origin:center;transform-box:fill-box;animation:eyeBlink 5.5s infinite}
#spriteBox .pupil{transform-origin:center;transform-box:fill-box;transition:transform .5s ease}
#spriteBox .eyebrow{transform-origin:center;transform-box:fill-box;transition:transform .2s ease}
#spriteBox .armL{transform-origin:90% 8%;transform-box:fill-box;transition:transform .6s cubic-bezier(.25,1,.35,1)}
#spriteBox .armR{transform-origin:10% 8%;transform-box:fill-box;transition:transform .6s cubic-bezier(.25,1,.35,1)}
#spriteBox .forearmL{transform-origin:50% 8%;transform-box:fill-box;transition:transform .6s cubic-bezier(.25,1,.35,1)}
#spriteBox .forearmR{transform-origin:50% 8%;transform-box:fill-box;transition:transform .6s cubic-bezier(.25,1,.35,1)}
#spriteBox .handL,#spriteBox .handR{transform-origin:center;transform-box:fill-box;transition:transform .4s}
#spriteBox .legL{transform-origin:50% 5%;transform-box:fill-box;transition:transform .6s cubic-bezier(.25,1,.35,1)}
#spriteBox .legR{transform-origin:50% 5%;transform-box:fill-box;transition:transform .6s cubic-bezier(.25,1,.35,1)}
#spriteBox .shinL{transform-origin:50% 5%;transform-box:fill-box;transition:transform .6s cubic-bezier(.25,1,.35,1)}
#spriteBox .shinR{transform-origin:50% 5%;transform-box:fill-box;transition:transform .6s cubic-bezier(.25,1,.35,1)}
#spriteBox .footL,#spriteBox .footR{transform-origin:center;transform-box:fill-box;transition:transform .4s}
#spriteBox .mouth{transform-origin:center;transform-box:fill-box;transition:transform .3s}
#spriteBox.talking .mouth{animation:mouthTalk .32s ease-in-out infinite}
#spriteBox.idle .body{animation:bodyBreathe 4.2s ease-in-out infinite}
#spriteBox.idle .head{animation:headBreathe 4.2s ease-in-out infinite}
#spriteBox.em-tired .eye{transform:scaleY(.25)}
#spriteBox.em-tired .eyebrow{transform:translateY(1.5px)}
#spriteBox.em-tired .head{transform:rotate(4deg) translateY(2px)}
#spriteBox.em-tired .mouth{transform:scaleY(.5) scaleX(.8)}
#spriteBox.em-happy .eyebrow{transform:translateY(-1px)}
#spriteBox.em-happy .mouth{transform:scale(1.25,1.25)}
#spriteBox.em-surprised .eye{transform:scale(1.22)}
#spriteBox.em-surprised .eyebrow{transform:translateY(-2px)}
#spriteBox.em-surprised .mouth{transform:scale(.7,1.35)}
#spriteBox.em-curious .head{transform:rotate(-5deg) translateX(1.5px)}
#spriteBox.em-curious .eyebrow{transform:translateY(0px)}
#spriteBox.em-sleepy .eye{transform:scaleY(.12)}
#spriteBox.em-sleepy .eyebrow{transform:translateY(1px)}
#spriteBox.em-sleepy .mouth{transform:scaleY(.4)}
#spriteBox.wavingSlow .armR{transform:rotate(-14deg)}
#spriteBox.wavingSlow .forearmR{animation:forearmWaveSlow 1.1s ease-in-out 2}
#spriteBox.wavingSlow .handR{animation:handWaveSlow 1.1s ease-in-out 2}
#spriteBox.thumbsUp .forearmR{transform:rotate(-75deg) translateY(-4px)}
#spriteBox.thumbsUp .handR{transform:scale(1.25) rotate(10deg)}
#spriteBox.salute .forearmR{transform:rotate(-110deg) translateY(-2px) translateX(2px)}
#spriteBox.shrug .armL{transform:rotate(-18deg)}
#spriteBox.shrug .armR{transform:rotate(18deg)}
#spriteBox.shrug .head{transform:translateY(3px)}
#spriteBox.peekaboo .forearmL{transform:rotate(75deg) translateY(-2px)}
#spriteBox.peekaboo .forearmR{transform:rotate(-75deg) translateY(-2px)}
#spriteBox.peekaboo .eye{transform:scaleY(.08)}
#spriteBox.sitting{transform:translateY(6px) scale(1,.92)}
#spriteBox.sitting .legL{transform:rotate(25deg)}
#spriteBox.sitting .legR{transform:rotate(-25deg)}
#spriteBox.sitting .shinL{transform:rotate(55deg)}
#spriteBox.sitting .shinR{transform:rotate(-55deg)}
#spriteBox.clapping .forearmL{animation:clapL .55s ease-in-out 2}
#spriteBox.clapping .forearmR{animation:clapR .55s ease-in-out 2}
#spriteBox.kicking .shinR{animation:legKickSlow .9s cubic-bezier(.25,1,.35,1) 1}
#spriteBox.footTapping .shinL{animation:footTapSlow .6s ease-in-out 2}
#spriteBox.jumping{animation:jumpFlowSlow 1.1s cubic-bezier(.25,1,.35,1) 1}
#spriteBox.lying{transform:translateY(3px)}
#spriteBox.sleeping{transform:translateY(2px) rotate(1deg)}
#spriteBox.sleeping .body{animation:sleepBreathe 4.5s ease-in-out infinite}
#spriteBox.sleeping .head{transform:rotate(8deg) translateY(3px) translateX(-2px)}
#spriteBox.sleeping .armL{transform:rotate(20deg)}
#spriteBox.sleeping .forearmL{transform:rotate(70deg)}
#spriteBox.sleeping .eye{animation:none;transform:scaleY(.08)}
#spriteBox.popping{animation:popFlowSlow .9s cubic-bezier(.25,1,.35,1) 1}
#spriteBox.spinning{animation:spinFlowSlow 1.2s cubic-bezier(.25,1,.35,1) 1}
#spriteBox.chasing .shinL{animation:runLegSlow .55s ease-in-out infinite}
#spriteBox.chasing .shinR{animation:runLegSlow .55s ease-in-out infinite reverse}
#spriteBox.dancing{animation:danceFlowSlow .8s ease-in-out 2}
#spriteBox.dancing .forearmL{animation:danceArmLSlow .8s ease-in-out 2}
#spriteBox.dancing .forearmR{animation:danceArmRSlow .8s ease-in-out 2}
#spriteBox.juggling .forearmL{animation:armJuggleSlow .8s ease-in-out 2}
#spriteBox.juggling .forearmR{animation:armJuggleSlow .8s ease-in-out 2}
#spriteBox.juggling .ball{opacity:1;animation:ballFlowSlow .8s ease-in-out 2}
#spriteBox.peeking{transform:translateY(14px) scale(.92,.88)}
#spriteBox.stretching{transform:scale(.95,1.08)}
#spriteBox.sneezing .head{animation:sneezeFlowSlow 1.1s ease-in-out 1}
#spriteBox.yawning .mouth{animation:yawnFlowSlow 1.8s ease-in-out 1}
#spriteBox.thinking .forearmR{animation:thinkArmSlow 1.4s ease-in-out 1}
#spriteBox.lookAround .pupil{animation:lookAround 2.2s ease-in-out 1}
@keyframes bodyBreathe{0%,100%{transform:scale(1,1) translateY(0)}50%{transform:scale(1.012,.988) translateY(-1px)}}
@keyframes headBreathe{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1px) rotate(.6deg)}}
@keyframes eyeBlink{0%,92%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}

@keyframes handWaveSlow{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(8deg) scale(1.08)}}
@keyframes clapL{0%,100%{transform:rotate(0)}50%{transform:rotate(34deg) translateX(3px)}}
@keyframes clapR{0%,100%{transform:rotate(0)}50%{transform:rotate(-34deg) translateX(-3px)}}

@keyframes footTapSlow{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(8deg)}}
@keyframes runLegSlow{0%,100%{transform:rotate(0)}50%{transform:rotate(24deg)}}
@keyframes jumpFlowSlow{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-14px) scale(.96,1.04)}55%{transform:translateY(0) scale(1.05,.95)}75%{transform:translateY(-4px) scale(.98,1.02)}100%{transform:translateY(0) scale(1,1)}}
@keyframes popFlowSlow{0%{transform:scale(.8,.8) translateY(10px)}60%{transform:scale(1.04,1.04) translateY(-2px)}100%{transform:scale(1,1) translateY(0)}}
@keyframes spinFlowSlow{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(.94)}100%{transform:rotate(360deg) scale(1)}}
@keyframes danceFlowSlow{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-3px)}}
@keyframes danceArmLSlow{0%,100%{transform:rotate(0)}50%{transform:rotate(-35deg)}}
@keyframes danceArmRSlow{0%,100%{transform:rotate(0)}50%{transform:rotate(35deg)}}
@keyframes armJuggleSlow{0%,100%{transform:rotate(0)}50%{transform:rotate(22deg) translateY(-4px)}}
@keyframes ballFlowSlow{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-10px);opacity:1}}
@keyframes sleepBreathe{0%,100%{transform:scale(1,1) translateY(0)}50%{transform:scale(1.015,1.015) translateY(1.2px)}}
@keyframes sneezeFlowSlow{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-2px) rotate(-3deg)}60%{transform:translateY(1.5px) rotate(2.5deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes yawnFlowSlow{0%,100%{transform:scaleY(1) scaleX(1)}50%{transform:scaleY(2.1) scaleX(1.1)}}
@keyframes thinkArmSlow{0%,100%{transform:rotate(0)}50%{transform:rotate(-42deg) translateY(-2px)}}
@keyframes lookAround{0%{transform:translate(0,0)}25%{transform:translate(-2.5px,0)}50%{transform:translate(2.5px,0)}75%{transform:translate(0,-1.5px)}100%{transform:translate(0,0)}}
#butterfly{position:absolute;width:28px;height:28px;z-index:9;pointer-events:none;opacity:0;transition:opacity .6s;will-change:transform}

body.chatting #thought{opacity:0!important}
#captionBubble{display:none;position:absolute;left:50%;top:-62px;transform:translateX(-50%);background:#fff;color:#111;font-size:11px;font-weight:700;padding:7px 10px;border-radius:14px;white-space:nowrap;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.5);cursor:pointer;max-width:230px;overflow:hidden;text-overflow:ellipsis}

#chatPanel{display:none;position:absolute;z-index:30;width:min(300px, calc(100vw - 20px));max-width:calc(100vw - 20px);background:#1E1E1E;border:2px solid #FFD700;border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.8);overflow:hidden}
#chatPanel.open{display:block}
#chatHeader{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 10px 10px 12px;background:#1A1505;user-select:none}
#chatDragZone{flex:1;min-width:0;cursor:grab;touch-action:none;padding:2px 0}
#chatHeader b{font-size:13px;color:#FFD700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chatHeader span{font-size:10px;color:#888;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#closeBtn{background:#FF4757!important;color:#fff!important;border:0!important;width:32px!important;height:32px!important;min-width:32px;border-radius:50%!important;font-size:16px!important;cursor:pointer;flex-shrink:0;margin-left:4px;z-index:5}
#chatBody{padding:10px}

.wb-msg{padding:9px 11px;border-radius:12px;font-size:13px;line-height:1.55;color:#FFFFFF;word-break:break-word}
.wb-msg.buddy{background:#2B2B2B;border:1px solid #FFD700;color:#FFFFFF}

</style>

<body>
<div id="room">
  <div id="butterfly"><svg viewBox="0 0 28 28"><path d="M14 14 C6 4 2 10 8 14 C2 18 6 24 14 14 Z" fill="#FF9F43"/><path d="M14 14 C22 4 26 10 20 14 C26 18 22 24 14 14 Z" fill="#4CC9FF"/><circle cx="14" cy="14" r="2" fill="#111"/></svg></div>
  <div id="buddyWrap">
    <div id="captionBubble" onclick="openChatFromCaption()"></div>
    <div id="thought"></div>
    <div id="zzzLayer"></div>
    <div id="spriteBox" class="idle"></div>
    <div id="miniLabel">CRYSTAL • TAP ME</div>

  </div>
  <div id="chatPanel">
    <div id="chatHeader"><div id="chatDragZone"><b id="chatTitle">💬 Crystal Buddy</b><span id="chatSubtitle">↕ Drag to move</span></div><button id="closeBtn">✕</button></div>
    <div id="chatBody"><div id="avatarPicker"></div><div id="chatLog"><div class="wb-msg buddy">Hey! What do you need?<small>Wave Buddy</small></div></div><div id="chatInputRow"><input id="chatInput" placeholder="Type anything..." autocomplete="off"><button id="sendBtn">Send</button><button id="speakBtn">🔊</button></div><div id="remindHint">💡 Hold buddy = cycle Tetra • Cube • Crystal • Dodeca • Icosa • Robo</div></div>
  </div>

</div>
<script>
var TIMING = { idleMin: 9000, idleMax: 14000, moveDuration: 2600, captionEvery: 120000 };
var AI_URL = '/.netlify/functions/ai';
var AVATAR_ORDER = ['tetra','cube','crystal','dodeca','icosa','robot'];
var currentAvatarKey = 'crystal';
var lastBuddyText = '';
var isChatting = false;
var chatLockUntil = 0;
var lastTapAt = 0;
var isDragging = false;
var didLongPress = false;
var idleTimer = null;
var zzzInterval = null;
var eyeMoveInterval = null;
var lastMoveIndex = -1;
if(window.location.search.indexOf('overlay=1') !== -1){ document.body.classList.add('overlay'); }
function loadMemory(){
  var m = null;
  try{ m = JSON.parse(localStorage.getItem('waveBuddyMemory') || 'null'); }catch(e){}
  if(!m){ try{ m = JSON.parse(sessionStorage.getItem('waveBuddyMemory') || 'null'); }catch(e){} }
  if(!m && window.__WB_MEMORY) m = window.__WB_MEMORY;
  if(!m) m = {};
  return m;
}
function saveMemory(m){
  window.__WB_MEMORY = m;
  try{ localStorage.setItem('waveBuddyMemory', JSON.stringify(m)); }catch(e){}
  try{ sessionStorage.setItem('waveBuddyMemory', JSON.stringify(m)); }catch(e){}
}
var memory = loadMemory();
if(!memory.facts) memory.facts = [];
if(!memory.reminders) memory.reminders = [];
if(!memory.chatCount) memory.chatCount = 0;
function getTimeContext(){
  var now = new Date(); var h = now.getHours(); var greeting=''; var vibe='';
  if(h>=5 && h<12){ greeting='Good morning'; vibe='morning'; }
  else if(h>=12 && h<17){ greeting='Good afternoon'; vibe='afternoon'; }
  else if(h>=17 && h<21){ greeting='Good evening'; vibe='evening'; }
  else { greeting='Yo, it is late'; vibe='night'; }
  return { hour:h, greeting:greeting, vibe:vibe, timeStr: now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) };
}
function nowStamp(){
  var d = new Date(); var h = d.getHours(); var m = d.getMinutes(); var ampm = h >= 12 ? 'PM' : 'AM'; var h12 = h % 12; if(h12 === 0) h12 = 12; var mm = m < 10 ? '0'+m : ''+m; return h12 + ':' + mm + ' ' + ampm;
}
function getMemoryPrompt(){
  var parts=[];
  if(memory.name) parts.push('User name is '+memory.name+'. Call them '+memory.name+' sometimes, naturally.');
  else parts.push('You do not know the user\'s name yet.');
  if(memory.facts.length>0) parts.push('Things you have remembered: '+memory.facts.slice(-10).join(' | ')+'.');
  if(memory.chatCount>0) parts.push('You have talked '+memory.chatCount+' times before.');
  var tc=getTimeContext(); parts.push('It is currently '+tc.timeStr+' in Trinidad, '+tc.vibe+'. '+tc.greeting+'.');
  if(memory.reminders.length>0){ var pending=memory.reminders.filter(function(r){return !r.done;}); if(pending.length>0) parts.push('Pending reminders: '+pending.map(function(r){return r.text;}).join(', ')+'.'); }
  return parts.join(' ');
}
function learnFromMessage(text){
  var lower=text.toLowerCase(); var foundName=null; var savedFact=null;
  var clean = text.replace(/[!?.,]/g,' ').replace(/\s+/g,' ').trim();
  var patterns = [
    /(?:my name is|my names|call me|name is|remember my name is|remember me as)\s+([a-zA-Z]+)/i,
    /(?:i am|i'm|im|iam)\s+([a-zA-Z]+)/i,
    /(?:hey im|hi im|yo im|hey i am|hi i am|yo i am|hey its|hi its|yo its|this is|its|it's|it is)\s+([a-zA-Z]+)/i
  ];
  for(var i=0; i<patterns.length; i++){
    var m = clean.match(patterns[i]);
    if(m && !lower.includes('remind')){
      var raw = m[1].toLowerCase();
      var junk = ['tired','hungry','bored','here','good','ok','fine','sad','happy','busy','sick','ready','late','back','home','gone','online','offline','new','old','cool','going','coming','looking','trying','just','so','very','really','the','a','an','my','your','not','is','am','im','me','i','hey','hi','yo','wats','whats','what','your','name','buddy','crystal','robo','robot'];
      if(junk.indexOf(raw) === -1 && raw.length >= 2 && raw.length <= 20){
        foundName = raw.charAt(0).toUpperCase() + raw.slice(1);
        if(memory.name !== foundName){ memory.name = foundName; saveMemory(memory); }
        break;
      }
    }
  }
  var remMatch = text.match(/(?:can\s+u|could\s+you|can\s+you|please)?\s*remember\s+(?:this\s+for\s+me|that\s+for\s+me|this|that|for\s+me|it)?\s+(.+)/i);
  if(remMatch){
    var factText = remMatch[1].trim();
    if(factText.length >= 2 && factText.toLowerCase().indexOf('my name') === -1){
      factText = factText.replace(/\s+please$/i,'').trim();
      var niceFact = factText.charAt(0).toUpperCase() + factText.slice(1);
      if(memory.facts.indexOf(niceFact) === -1){ memory.facts.push(niceFact); savedFact = niceFact; saveMemory(memory); } else { savedFact = niceFact; }
    }
  }
  var likeMatch=text.match(/i (?:like|love) (.+)/i);
  if(likeMatch){
    var liked = likeMatch[1].trim().toLowerCase();
    if(liked==='ya'||liked==='you'||liked==='u'||liked==='you so much'||liked==='ya so much'){ likeMatch=null; }
  }
  if(likeMatch && !lower.includes('remember')){ var fact='Likes '+likeMatch[1].trim(); if(memory.facts.indexOf(fact)===-1){ memory.facts.push(fact); saveMemory(memory); } }
  return { name: foundName, fact: savedFact };
}
function flipPronounsForYou(raw){
  var s = raw.trim();
  if(/^\s*say\s+/i.test(s)){ var afterSay = s.replace(/^\s*say\s+/i, ''); if(afterSay.length > 0) afterSay = afterSay.charAt(0).toUpperCase() + afterSay.slice(1); return 'Say ' + afterSay; }

  buildSprite(key); renderAvatarPicker();
  try{ localStorage.setItem('waveBuddyAvatar',key); }catch(e){}
}
function swapNextAvatar(){
  var idx = AVATAR_ORDER.indexOf(currentAvatarKey);
  var next = AVATAR_ORDER[(idx+1) % AVATAR_ORDER.length];
  setAvatar(next);
  var emojis={tetra:'🔺 Tetra time!', cube:'🧊 Cube time!', crystal:'💎 Crystal is back!', dodeca:'🔮 Dodeca time!', icosa:'🧠 Icosa time!', robot:'🤖 Robo time!'};
  showThought(emojis[next]||'✨');
  if(navigator.vibrate) navigator.vibrate(50);

function getSystemPrompt(){ var a=AVATARS[currentAvatarKey]; return 'You are Wave Buddy. Your character is '+a.name+'. Personality: '+a.personality+' Keep answers to 2-3 sentences max, fun for a teen. Never repeat. Stay in character. IMPORTANT: You are speaking TO the user, not AS the user. Use YOU / YOUR when talking about the user. If the user tells you their name in ANY form, remember it and use it. MEMORY: '+getMemoryPrompt(); }
function addMsg(who,text){ var log=document.getElementById('chatLog'); var d=document.createElement('div'); d.className='wb-msg '+who; var label = who==='buddy' ? 'Wave Buddy' : 'You'; d.innerHTML=String(text).replace(/\n/g,'<br>')+'<small>'+label+' • '+nowStamp()+'</small>'; log.appendChild(d); log.scrollTop=log.scrollHeight; if(who==='buddy') lastBuddyText=text; }
function localFallbackAnswer(userText){
  var lower=userText.toLowerCase(); var namePart=memory.name ? ', '+memory.name : '';
  if(lower.includes('joke')){
    return 'Okay'+namePart+', 10 jokes, offline edition:\n1. Why did the triangle go to therapy? Too many issues.\n2. What do you call a fake noodle? An impasta.\n3. Why did the cube sit down? It was squared.\n4. Why is the math book sad? Too many problems.\n5. What do skeletons say? Bone-jour!\n6. Why did the phone go to school? To get smarter.\n7. What is a robot\'s fav snack? Computer chips.\n8. Why did the chicken cross the playground? To get to the other slide.\n9. What do you call cheese that isn\'t yours? Nacho cheese.\n10. Why was the computer cold? It left its Windows open.';
  }
  if(lower.includes('how are you')||lower.includes('how are u')||lower.includes('how r u')||lower.includes('wats up')||lower.includes("what's up")||lower.includes('wassup')) return 'I am good'+namePart+'! Shining as always. How are you?';
  if(lower.includes('hello')||lower.includes('hey')||lower.includes('hi')) return 'Hey'+namePart+'! I am here, even offline. What do you need?';
  if(lower.includes('who are you')||lower.includes('what are you')) return 'I am '+AVATARS[currentAvatarKey].name+'! Your Wave Buddy. I can chat, remember stuff, and set reminders.';
  if(lower.includes('love you')||lower.includes('like you')||lower.includes('like ya')) return 'Aww, I like you too'+namePart+'! You are my favorite human.';
  if(lower.includes('what do you remember')||lower.includes('what did i tell')) {
    if(memory.facts.length) return 'I remember: '+memory.facts.slice(-3).join(', ')+'.';
    return 'I haven\'t remembered anything yet.';
  }
  return 'Yo'+namePart+'! My AI is offline right now, but I heard you - you said "'+userText+'". Try me again when we are on GitHub, I will be full AI there.';
}
async function askBuddy(userText){
  var lower=userText.toLowerCase();
  var switchMatch = lower.match(/(?:switch to|become|show me|turn into|i want|use)\s+(tetra|cube|crystal|dodeca|icosa|robo|robot|octahedron|octa)/);
  if(switchMatch){
    var map={octa:'crystal', octahedron:'crystal', robot:'robot'};
    var want = map[switchMatch[1]] || switchMatch[1];
    if(AVATARS[want]){ setAvatar(want); addMsg('buddy','Switched! I am '+AVATARS[want].name+' now.'); return; }
  }
  if(lower.includes('my name') || lower.includes('whats my name') || lower.includes("what's my name") || lower.includes('wats my name') || lower.includes('who am i') || lower.includes('do you know my name') || lower.includes('do u know my name')){
    var justLearned = learnFromMessage(userText);
    if(justLearned.name){ addMsg('buddy','Got it, '+justLearned.name+'! Saved. Your name is '+justLearned.name+'.'); return; }
    if(memory.name){ addMsg('buddy','Your name is '+memory.name+'! I remember you.'); return; }
    addMsg('buddy','I don\'t know your name yet - you haven\'t told me in this session. What should I call you? Just say "hey im..."'); return;
  }
  if(lower.includes('what do you remember') || lower.includes('what did i tell you') || lower.includes('what did you remember') || lower.includes('what have you remembered') || lower.includes('what do u remember') || lower.includes('what did i ask you to remember')){
    var all = [];
    if(memory.name) all.push('Your name is '+memory.name);
    if(memory.facts.length) all = all.concat(memory.facts);
    if(all.length===0) addMsg('buddy','I haven\'t remembered anything yet. Tell me something with "remember..." and I will lock it in.');
    else addMsg('buddy','Here is what I actually remembered for you:<br>• '+all.join('<br>• '));
    return;
  }
  if(lower.indexOf('what reminders')!==-1 || lower.indexOf('my reminders')!==-1){ var pending=memory.reminders.filter(function(r){return !r.done;}); if(pending.length===0) addMsg('buddy','You have no reminders right now.'); else addMsg('buddy','Your reminders: '+pending.map(function(r){return '• '+r.text;}).join('<br>')); return; }
  if(lower.indexOf('clear reminders')!==-1 || lower.indexOf('delete reminders')!==-1){ memory.reminders=[]; saveMemory(memory); addMsg('buddy','Cleared all reminders.'); return; }
  if(lower.indexOf('forget everything')!==-1 || lower.indexOf('forget all')!==-1){ memory.name=null; memory.facts=[]; saveMemory(memory); addMsg('buddy','Okay, forgot everything. Fresh start.'); return; }
  if(lower.indexOf('forget me')!==-1 || lower.indexOf('forget my name')!==-1){ memory.name=null; memory.facts=[]; saveMemory(memory); addMsg('buddy','Okay, I forgot. Who are you again?'); return; }
  var rem=parseReminder(userText);
  if(rem){ memory.reminders.push({text:rem.text, time:rem.time, done:false}); saveMemory(memory); addMsg('buddy','Got it! I will remind you to '+rem.text.charAt(0).toLowerCase()+rem.text.slice(1)+' in '+formatDelay(rem.delay)+'.'); showCaption('⏰ Reminder set: '+rem.text, 5000); return; }
  var learned = learnFromMessage(userText);
  if(learned.fact){ addMsg('buddy','Got it'+(memory.name ? ', '+memory.name : '')+' - locked in: "'+learned.fact+'". I will remember that for real.'); memory.chatCount=(memory.chatCount||0)+1; saveMemory(memory); return; }
  if(learned.name){ addMsg('buddy','Nice to meet you, '+learned.name+'! I will remember that.'); memory.chatCount=(memory.chatCount||0)+1; saveMemory(memory); return; }
  memory.chatCount=(memory.chatCount||0)+1; saveMemory(memory);
  var box=document.getElementById('spriteBox'); box.classList.add('talking'); setEmotion('happy'); updateMood('talking');
  addMsg('buddy','🤔 Thinking...'); var thinkingEl=document.getElementById('chatLog').lastChild;
  try{ var res=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:getSystemPrompt()+'\n\nUser: '+userText+'\nBuddy:'})}); if(!res.ok) throw new Error('AI '+res.status); var data=await res.json(); var answer=data.answer||data.text||''; if(!answer) throw new Error('empty'); thinkingEl.remove(); addMsg('buddy',answer); showThought('💬'); speakText(answer); }catch(e){ thinkingEl.remove(); var fb=localFallbackAnswer(userText); addMsg('buddy',fb); }
  box.classList.remove('talking'); setEmotion('idle'); updateMood('idle');
}
function sendChat(){ var input=document.getElementById('chatInput'); var text=input.value.trim(); if(!text) return; addMsg('you',text); input.value=''; askBuddy(text); }
function positionChat(){ try{ var saved=localStorage.getItem('waveBuddyChatPos'); if(saved){ var p=JSON.parse(saved); var panel=document.getElementById('chatPanel'); var w=panel.offsetWidth||300; var maxLeft=Math.max(10, window.innerWidth-w-10); var maxTop=Math.max(10, window.innerHeight-200); panel.style.left=Math.min(maxLeft, Math.max(10, p.left))+'px'; panel.style.top=Math.min(maxTop, Math.max(10, p.top))+'px'; return; } }catch(e){} var wrap=document.getElementById('buddyWrap'); var panel=document.getElementById('chatPanel'); var rect=wrap.getBoundingClientRect(); var panelW=Math.min(300, window.innerWidth-20); var left=Math.min(window.innerWidth-panelW-10,Math.max(10,rect.left-92)); var top=Math.max(10,rect.top-220); panel.style.left=left+'px'; panel.style.top=top+'px'; }
function openChat(){ if(isChatting) return; if(Date.now()<chatLockUntil) return; chatLockUntil=Date.now()+400; isChatting=true; document.body.classList.add('chatting'); positionChat(); document.getElementById('chatPanel').classList.add('open'); var tc=getTimeContext(); var greet = memory.name ? tc.greeting+', '+memory.name+'!' : tc.greeting+'!'; setEmotion('happy'); updateMood('talking'); var lines=[greet+' What do you need?', 'Yo! I was just chilling. What is up?', 'You tapped me! What do you want?']; addMsg('buddy',lines[Math.floor(Math.random()*lines.length)]); setTimeout(function(){ var inp=document.getElementById('chatInput'); if(inp) inp.focus(); },100); }
function closeChat(){ if(!isChatting) return; isChatting=false; document.body.classList.remove('chatting'); document.getElementById('chatPanel').classList.remove('open'); chatLockUntil=Date.now()+400; saveChatPos(); showThought('😴'); setEmotion('tired'); updateMood('idle'); scheduleIdle(); }
function speakText(text){
  if(!text) return;
  var clean = String(text).replace(/<[^>]*>/g,'').slice(0,300);
  if(window.AndroidMini && window.AndroidMini.speak){
    try{ window.AndroidMini.speak(clean); return; }catch(e){}
  }
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(clean);
    u.lang = 'en-US';
    u.rate = 0.95;
    u.pitch = 1;
    u.volume = 1;
    var voices = speechSynthesis.getVoices();
    var enVoice = voices.find(function(v){ return v.lang === 'en-US' && v.name.toLowerCase().indexOf('google') !== -1; })
      || voices.find(function(v){ return v.lang === 'en-US'; })
      || voices.find(function(v){ return v.lang && v.lang.indexOf('en') === 0; });
    if(enVoice) u.voice = enVoice;
    speechSynthesis.speak(u);
  }catch(e){}
}
if('speechSynthesis' in window){
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = function(){ speechSynthesis.getVoices(); };
}
(function(){
  var wrap=document.getElementById('buddyWrap'); var panel=document.getElementById('chatPanel'); var dragZone=document.getElementById('chatDragZone');
  var startX=0,startY=0,startLeft=0,startTop=0,moved=false,pressTimer=null,draggingChat=false,draggingBuddy=false,downTime=0;
  function getP(e){ return e.touches ? e.touches[0] : e; }
  function buddyDown(e){
    if(e.target.closest('#chatPanel')) return;
    var p=getP(e); startX=p.clientX; startY=p.clientY; downTime=Date.now();
    var r=wrap.getBoundingClientRect(); startLeft=r.left; startTop=r.top;
    moved=false; isDragging=false; didLongPress=false; draggingBuddy=true;
    if(document.getElementById('spriteBox').className.indexOf('sleeping')!==-1){ setSpriteState('popping',900,'surprised'); showThought('😳 Huh? I am awake!'); }
    pressTimer=setTimeout(function(){ didLongPress=true; swapNextAvatar(); if(navigator.vibrate) navigator.vibrate(50); },800);
  }
  function chatDown(e){
    var p=getP(e); startX=p.clientX; startY=p.clientY; startLeft=panel.offsetLeft; startTop=panel.offsetTop;
    draggingChat=true; moved=false; e.preventDefault(); e.stopPropagation();
  }
  function onMove(e){
    var p=getP(e); var dx=p.clientX-startX, dy=p.clientY-startY;
    if(draggingChat){
      if(Math.abs(dx)>4||Math.abs(dy)>4) moved=true;
      var w=panel.offsetWidth||300;
      panel.style.left=Math.max(10,Math.min(window.innerWidth-w-10,startLeft+dx))+'px';
      panel.style.top=Math.max(10,Math.min(window.innerHeight-120,startTop+dy))+'px';
      if(e.cancelable) e.preventDefault(); return;
    }
    if(!draggingBuddy) return;
    if(e.target.closest && e.target.closest('#chatPanel')) return;
    if(Math.abs(dx)>8||Math.abs(dy)>8){
      moved=true; isDragging=true; clearTimeout(pressTimer);
      wrap.style.left=Math.max(0,Math.min(window.innerWidth-130,startLeft+dx))+'px';
      wrap.style.top=Math.max(40,Math.min(window.innerHeight-180,startTop+dy))+'px';
      wrap.style.transform='none';
      if(e.cancelable) e.preventDefault();
    }
  }
  function onUp(e){
    clearTimeout(pressTimer);
    if(draggingChat){ draggingChat=false; if(moved) saveChatPos(); return; }
    if(!draggingBuddy) return;
    draggingBuddy=false;
    if(e.target.closest && e.target.closest('#chatPanel')) return;
    var wasDragging=isDragging; isDragging=false;
    if(moved){ savePosition(); return; }
    if(didLongPress){ setTimeout(function(){didLongPress=false;},200); return; }
    if(Date.now()<chatLockUntil) return;
    if(!isChatting) openChat(); else closeChat();
  }
  wrap.addEventListener('pointerdown', buddyDown);
  dragZone.addEventListener('pointerdown', chatDown);
  window.addEventListener('pointermove', onMove, {passive:false});
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  document.getElementById('closeBtn').addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); closeChat(); });
  document.getElementById('sendBtn').addEventListener('click', function(e){ e.stopPropagation(); sendChat(); });
  document.getElementById('speakBtn').addEventListener('click', function(e){ e.stopPropagation(); if(lastBuddyText) speakText(lastBuddyText); });
  document.getElementById('chatInput').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); sendChat(); } });
  document.getElementById('chatInput').addEventListener('click', function(e){ e.stopPropagation(); });
  document.getElementById('chatPanel').addEventListener('pointerdown', function(e){ if(e.target.closest('#chatDragZone')||e.target.id==='closeBtn') return; e.stopPropagation(); });
})();
